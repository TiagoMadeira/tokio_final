name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches:
      - master

jobs:
  dev:
    uses: ./.github/workflows/build-services.yaml
    secrets:
      dockerhub-access-token: ${{secrets.DOCKERHUB_ACCESS_TOKEN}}

  staging:
    runs-on: [self-hosted]
    needs: [dev]
    permissions:
      security-events: write
      contents: read
    defaults:
      run:
        shell: bash
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Set up Python  # Uses python version in .python-version file
        uses: actions/setup-python@v6

      - name: Pip audit Auth Service  # Uses python version in .python-version file
        run: |
          cd  auth_service
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install pip==${{vars.PIP_VERSION}}
          pip install pip-audit
          pip-audit -r requirements-prd.txt
      
      - name: Pip audit Post Service  # Uses python version in .python-version file
        run: |
          cd  post_service
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install pip==${{vars.PIP_VERSION}}
          pip install pip-audit
          pip-audit -r requirements-prd.txt
      
      - name: Pip audit Rest Service # Uses python version in .python-version file
        run: |
          cd  rest_service
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install pip==${{vars.PIP_VERSION}}
          pip install pip-audit
          pip-audit -r requirements-prd.txt

      - name: Run Trivy scan Auth Service
        run: |
          trivy fs --config trivy_conf/trivy.yaml --format table auth_service

      - name: Run Trivy scan Post Service
        run: | 
          trivy fs --config trivy_conf/trivy.yaml --format table post_service

      - name: Run Trivy scan Rest Service
        run: |
          trivy fs --config trivy_conf/trivy.yaml --format table rest_service

      - name: Run Trivy scan Frontend
        run: |
          trivy fs --config trivy_conf/trivy.yaml --format table frontend
        
      - name: Run Trivy scan K8s Configs
        run: |
          trivy fs --config trivy_conf/trivy.yaml --format table k8s-configs

      - name: Check Minikube status
        id: status_check
        continue-on-error: true 
        run: minikube status && echo "active=true" >> $GITHUB_OUTPUT || echo "active=false" >> $GITHUB_OUTPUT

      - name: start minikube
        if: steps.status_check.outputs.active == 'false'
        run: |
          echo "Checking Minikube status..."
          if minikube status >/dev/null 2>&1; then
            echo "Minikube is already running."
          else
            echo "Starting Minikube..."
            minikube start --driver=docker
            echo "Enabling Ingress addon..."
            minikube addons enable ingress
          fi

      - name: Wait for Ingress Controller
        run: |
          minikube kubectl -- wait --namespace ingress-nginx \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/component=controller \
          --timeout=120s
      
      - name: start obeservability server
        run: |
          echo "Checking for observability namespace..."
          if ! minikube kubectl -- get namespace observability ; then
            minikube kubectl -- create namespace observability
          fi
          echo "Applying configurations (idempotent)..."
          minikube kubectl -- apply -f k8s-configs/observability/configmaps/jaeger-configmap.yaml
          minikube kubectl -- apply -f k8s-configs/observability/configmaps/jaeger-ui-config.yaml
          minikube kubectl -- apply -f k8s-configs/observability/manifests/jaeger-deployment.yaml
          minikube kubectl -- apply -f k8s-configs/observability/ingress/jaeger-ingress.yaml
     
      - name: Wait for observability server to be up and running
        run: |
          minikube kubectl -- wait --namespace observability \
          --for=condition=ready pod \
          --all \
          --timeout=240s

      - name: start staging server
        env:
          STAGING_BACKEND_TLS_CERT: ${{ secrets.STAGING_BACKEND_TLS_CERT }}
          STAGING_BACKEND_TLS_KEY: ${{ secrets.STAGING_BACKEND_TLS_KEY }}
          STAGING_FRONTEND_TLS_CERT: ${{ secrets.STAGING_FRONTEND_TLS_CERT }}
          STAGING_FRONTEND_TLS_KEY: ${{ secrets.STAGING_FRONTEND_TLS_KEY }}
          DOCKERHUB_ACCESS_TOKEN: ${{secrets.DOCKERHUB_ACCESS_TOKEN}}
        run: |
          if  minikube kubectl -- get namespace staging ; then
            echo applying config files
            minikube kubectl -- apply -f k8s-configs/staging/configmaps/frontend-configmap.yaml
            minikube kubectl -- apply -f k8s-configs/staging/configmaps/auth-service-configmap.yaml
            minikube kubectl -- apply -f k8s-configs/staging/configmaps/post-service-configmap.yaml
            minikube kubectl -- apply -f k8s-configs/staging/configmaps/rest-service-configmap.yaml
            echo rollout deployments
            minikube kubectl -- rollout restart deployment frontend-deployment -n staging
            minikube kubectl -- rollout restart deployment auth-service-deployment -n staging
            minikube kubectl -- rollout restart deployment post-service-deployment -n staging
            minikube kubectl -- rollout restart deployment rest-service-deployment -n staging
          else
            # 1. Decode base64 secrets into temporary files
            echo "$STAGING_BACKEND_TLS_CERT" | base64 --decode > staging-backend-tls.crt
            echo "$STAGING_BACKEND_TLS_KEY" | base64 --decode > staging-backend-tls.key
            echo "$STAGING_BACKEND_TLS_CERT" | base64 --decode > staging-frontend-tls.crt
            echo "$STAGING_BACKEND_TLS_KEY" | base64 --decode > staging-frontend-tls.key

            echo create staging namespace
            minikube kubectl -- create namespace staging
            echo appling pods secrets
            minikube kubectl -- create secret docker-registry regcred --namespace staging --docker-server=https://index.docker.io/v1/ --docker-username=${{vars.DOCKER_USERNAME}} --docker-password=$DOCKERHUB_ACCESS_TOKEN --docker-email=${{vars.DOCKER_EMAIL}} > /dev/null 2>&1
            minikube kubectl -- create secret tls backend-tls-secret --namespace staging --cert=staging-backend-tls.crt --key=staging-backend-tls.key
            minikube kubectl -- create secret tls frontend-staging-posts-com-tls --namespace staging --cert=staging-frontend-tls.crt --key=staging-frontend-tls.key
            minikube kubectl -- apply -f k8s-configs/staging/secrets/auth-service-secrets.yaml
            echo applying config files
            minikube kubectl -- apply -f k8s-configs/staging/configmaps/frontend-configmap.yaml
            minikube kubectl -- apply -f k8s-configs/staging/configmaps/auth-service-configmap.yaml
            minikube kubectl -- apply -f k8s-configs/staging/configmaps/post-service-configmap.yaml
            minikube kubectl -- apply -f k8s-configs/staging/configmaps/rest-service-configmap.yaml
            echo applying deployments
            minikube kubectl -- apply -f k8s-configs/staging/manifests/frontend-deployment.yaml
            minikube kubectl -- apply -f k8s-configs/staging/manifests/rest-service-deployment.yaml
            minikube kubectl -- apply -f k8s-configs/staging/manifests/post-service-deployment.yaml
            minikube kubectl -- apply -f k8s-configs/staging/manifests/auth-service-deployment.yaml
            echo applying ingresses
            minikube kubectl -- apply -f k8s-configs/staging/ingress/frontend-posts-ingress.yaml

            # 3. Cleanup sensitive temporary files
            rm staging-backend-tls.crt staging-backend-tls.key staging-frontend-tls.crt staging-frontend-tls.key
          fi
      
      - name: Wait for pods in staging to be up and running
        run: |
          minikube kubectl -- wait --namespace staging \
          --for=condition=ready pod \
          --all \
          --timeout=500s
      
      - name: Prepare rest service for integration testing
        run: |
         
          minikube kubectl -- port-forward service/rest-internal-service 8000:80 -n staging &
          sleep 5 # Wait for the tunnel to initialize
      
      - name: Prepare frontend for e2e testing
        shell: bash
        run: |
          minikube kubectl -- port-forward service/frontend-internal-service 3000:80 -n staging &
          sleep 5

      - name: auth service service unit testing
        env:
          JWT_SECRET: ${{ secrets.JWT_KEY }}
        shell: bash
        run: |
          echo "SECRET_KEY=$JWT_SECRET" >> $GITHUB_ENV
          python -m venv "$GITHUB_WORKSPACE/auth_service/.venv"
          source "$GITHUB_WORKSPACE/auth_service/.venv/bin/activate"
        
          pip install -r "$GITHUB_WORKSPACE/auth_service/requirements-stg.txt"
        
          export PYTHONPATH="$GITHUB_WORKSPACE/auth_service"
        
          pytest "$GITHUB_WORKSPACE/auth_service/tests/" \
            --cov="$GITHUB_WORKSPACE/auth_service/app" \
            --cov-report=xml:"$GITHUB_WORKSPACE/auth_service/coverage.xml"

      - name: post service unit testing
        shell: bash
        run: |
          python -m venv "$GITHUB_WORKSPACE/post_service/.venv"
          source "$GITHUB_WORKSPACE/post_service/.venv/bin/activate"
        
          pip install -r "$GITHUB_WORKSPACE/post_service/requirements-stg.txt"
        
          export PYTHONPATH="$GITHUB_WORKSPACE/post_service"
        
          pytest "$GITHUB_WORKSPACE/post_service/tests/" \
            --cov="$GITHUB_WORKSPACE/post_service/app" \
            --cov-report=xml:"$GITHUB_WORKSPACE/post_service/coverage.xml"

      - name: rest service unit and integration testing
        shell: bash
        run: |
          python -m venv "$GITHUB_WORKSPACE/rest_service/.venv"
          source "$GITHUB_WORKSPACE/rest_service/.venv/bin/activate"
        
          pip install -r "$GITHUB_WORKSPACE/rest_service/requirements-stg.txt"
        
          export PYTHONPATH="$GITHUB_WORKSPACE/rest_service"
        
          pytest "$GITHUB_WORKSPACE/rest_service/tests/" \
            --cov="$GITHUB_WORKSPACE/rest_service/app" \
            --cov-report=xml:"$GITHUB_WORKSPACE/rest_service/coverage.xml"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: frontend unit and integration testing and E2E
        shell: bash
        run: |
          cd  frontend
          npm ci
          npx playwright install chromium
          npm run test -- --coverage --watch=false
          npx playwright test   


      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io"

      - name: Clean staging enviroment for next run
        if: always()
        run: |
          minikube kubectl -- delete namespace staging


  production:
    runs-on: [self-hosted]
    needs: [staging]
    defaults:
      run:
        # Use the built-in wsl shell handler
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: start minikube
        run: |
          echo "Checking Minikube status..."
          if minikube status >/dev/null 2>&1; then
            echo "Minikube is already running."
          else
            echo "Starting Minikube..."
            minikube start --driver=docker
            echo "Enabling Ingress addon..."
            minikube addons enable ingress
          fi
      
      - name: start production server
        env: 
          DOCKERHUB_ACCESS_TOKEN: ${{secrets.DOCKERHUB_ACCESS_TOKEN}}
          PROD_BACK_TLS_CERT: ${{ secrets.TLS_CERT }}
          PROD_BACK_TLS_KEY: ${{ secrets.TLS_KEY }}
          PROD_FRONT_TLS_CERT: ${{ secrets.PROD_FRONT_TLS_CERT }}
          PROD_FRONT_TLS_KEY: ${{ secrets.PROD_FRONT_TLS_KEY }}
        run: |
          if  minikube kubectl -- get namespace production; then
            echo applying config files
            minikube kubectl -- apply -f k8s-configs/production/configmaps/frontend-configmap.yaml
            minikube kubectl -- apply -f k8s-configs/production/configmaps/auth-service-configmap.yaml
            minikube kubectl -- apply -f k8s-configs/production/configmaps/post-service-configmap.yaml
            minikube kubectl -- apply -f k8s-configs/production/configmaps/rest-service-configmap.yaml
            echo rollout deployments
            minikube kubectl -- rollout restart deployment frontend-deployment -n production
            minikube kubectl -- rollout restart deployment auth-service-deployment -n production
            minikube kubectl -- rollout restart deployment post-service-deployment -n production
            minikube kubectl -- rollout restart deployment rest-service-deployment -n production
          else
            # 1. Decode base64 secrets into temporary files
            echo "$PROD_BACK_TLS_CERT" | base64 --decode --ignore-garbage > prod-backend-tls.crt
            echo "$PROD_BACK_TLS_KEY" | base64 --decode --ignore-garbage > prod-backend-tls.key
            echo "$PROD_FRONT_TLS_CERT" | base64 --decode --ignore-garbage > prod-frontend-tls.crt
            echo "$PROD_FRONT_TLS_KEY" | base64 --decode --ignore-garbage > prod-frontend-tls.key

            echo create production namespace
            minikube kubectl -- create namespace production
            echo creating docker registry secret
            minikube kubectl -- create secret docker-registry regcred --namespace production --docker-server=https://index.docker.io/v1/ --docker-username=${{vars.DOCKER_USERNAME}} --docker-password=$DOCKERHUB_ACCESS_TOKEN --docker-email=${{vars.DOCKER_EMAIL}} > /dev/null 2>&1
            echo appling pods secrets
            minikube kubectl -- apply -f k8s-configs/production/secrets/auth-service-secrets.yaml
            minikube kubectl -- create secret tls backend-tls-secret --namespace production --cert=prod-backend-tls.crt --key=prod-backend-tls.key
            minikube kubectl -- create secret tls frontend-production-posts-com-tls --namespace production --cert=prod-frontend-tls.crt --key=prod-frontend-tls.key
            echo applying config files
            minikube kubectl -- apply -f k8s-configs/production/configmaps/frontend-configmap.yaml
            minikube kubectl -- apply -f k8s-configs/production/configmaps/auth-service-configmap.yaml
            minikube kubectl -- apply -f k8s-configs/production/configmaps/post-service-configmap.yaml
            minikube kubectl -- apply -f k8s-configs/production/configmaps/rest-service-configmap.yaml
            echo applying deployments
            minikube kubectl -- apply -f k8s-configs/production/manifests/frontend-deployment.yaml
            minikube kubectl -- apply -f k8s-configs/production/manifests/rest-service-deployment.yaml
            minikube kubectl -- apply -f k8s-configs/production/manifests/post-service-deployment.yaml
            minikube kubectl -- apply -f k8s-configs/production/manifests/auth-service-deployment.yaml
            echo applying ingresses
            minikube kubectl -- apply -f k8s-configs/production/ingress/frontend-posts-ingress.yaml
            # 3. Cleanup sensitive temporary files
            rm prod-backend-tls.crt prod-backend-tls.key prod-frontend-tls.crt prod-frontend-tls.key
          fi




    
