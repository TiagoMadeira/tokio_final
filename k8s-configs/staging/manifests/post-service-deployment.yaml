apiVersion: apps/v1
kind: Deployment
metadata:
    name: post-service-deployment
    namespace: staging
    labels:
      app: post-service
spec:
  selector:
    matchLabels:
      app: post-service
  template:
    metadata:
      labels:
        app: post-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: post-service
        image: docker.io/tiagomadeiradock/tokio-post-service:latest
        imagePullPolicy: Always
        workingDir: /home/appuser   
        securityContext:
          runAsUser: 10001     # Matches the UID 10001 from your Dockerfile
          runAsGroup: 10001 
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

        volumeMounts:
          - name: app-write-space
            mountPath: /home/appuser/app/data

        resources:
          limits:
            memory: 512Mi
            cpu: "1"
            ephemeral-storage: "1Gi"
          requests:
            memory: 256Mi
            cpu: "0.1"
            ephemeral-storage: "256Mi"

        ports:
          - name: http
            protocol: TCP
            containerPort: 8000
        env:
          - name: ENV
            value: "staging"

          - name: AUTH_SERVICE_URL
            valueFrom:
             configMapKeyRef:
                name: post-service-configmap
                key: auth_service_url

          - name: DATABASE_URL
            valueFrom:
             configMapKeyRef:
                name: post-service-configmap
                key: database-url
                
          - name: OTEL_SERVICE_NAME
            valueFrom:
             configMapKeyRef:
                name: post-service-configmap
                key: otel-service-name

          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            valueFrom:
             configMapKeyRef:
                name: post-service-configmap
                key: otel-exporter-endpoint
          
          - name: OTEL_EXPORTER_OTLP_INSECURE 
            valueFrom:
             configMapKeyRef:
                name: post-service-configmap
                key: otel-exporter-insecure

          - name: OTEL_METRICS_EXPORTER
            valueFrom:
             configMapKeyRef:
                name: post-service-configmap
                key: otel-metrics-exporter

          - name: OTEL_LOGS_EXPORTER
            valueFrom:
             configMapKeyRef:
                name: post-service-configmap
                key: otel-logs-exporter
                
      volumes:
        - name: app-write-space
          emptyDir: {}

      imagePullSecrets:
      - name: regcred
              
---
apiVersion: v1
kind: Service
metadata:
  name: post-internal-service
  namespace: staging
spec:
  selector:
    app: post-service
  type: ClusterIP
  ports:
    - port: 8080
      protocol: TCP
      targetPort: http