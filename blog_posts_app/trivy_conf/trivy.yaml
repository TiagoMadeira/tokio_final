
ignorefile: blog_posts_app/trivy_conf/.trivyignore

rego:
  # Same as '--config-data'
  data:
    - "blog_posts_app/trivy_data"

scan:
  scanners:
    - vuln
    - secret
    - misconfig 

  # trivy.yaml
  file-patterns:
    - "pip:requirements-prd.txt"
    - "pip:requirements-stg.txt"
    - "dockerfile:Dockerfile" 

  skip-files:
    - "state.json"
  
  skip-dirs:
    - .venv
    - venv
    - __pycache__

severity:
  - LOW
  - MEDIUM
  - HIGH
  - CRITICAL

vulnerability:
  ignore-unfixed: false

db:
  repository: public.ecr.aws/aquasecurity/trivy-db:2
