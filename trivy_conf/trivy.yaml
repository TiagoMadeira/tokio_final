
ignorefile: /trivy_conf/.trivyignore
config-data: /trivy_conf/trivy-data.yaml

scan:
  scanners:
    - vuln
    - secret
    - misconfig 

  # trivy.yaml
  file-patterns:
    - "pip:requirements-prd.txt"
    - "pip:requirements-stg.txt"

  skip-files:
    - "state.json"

severity:
  - LOW
  - MEDIUM
  - HIGH
  - CRITICAL

vulnerability:
  ignore-unfixed: false

misconfiguration:
  namespaces:
    - tiagomadeiradock
      
db:
  repository: public.ecr.aws/aquasecurity/trivy-db:2
