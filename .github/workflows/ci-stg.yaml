name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [development]
  push:
    branches:
      - development

jobs:
  test-services-stg:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Test Services
      uses: ./.github/worflows/test-services.yaml
      with:
        secrets: inherit

  trivy-scan-services-stg:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Trivy Scan Services
      uses: ./.github/worflows/trivy-scan-services.yaml
      with:
        environment: "staging"

  build-push-auth-service-stg:
    runs-on: ubuntu-latest
    needs: [ test-services-stg, trivy-scan-services-stg ]
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build push dev
        uses: ./.github/actions/build-push
        with:
          context_path: "auth_service"
          docker-file-path: ${{vars.AUTH_SERVICE_DOCKERFILE}}
          dockerhub-usernane: ${{vars.DOCKER_USERNAME}}
          dockerhub-access-token: ${{secrets.DOCKERHUB_ACCESS_TOKEN}}
          dockerhub-repository: ${{vars.AUTH_SERVICE_DOCKERHUB_REPOSITORY}}

  build-push-post-service-stg:
    runs-on: ubuntu-latest
    needs: [ test-services-stg, trivy-scan-services-stg ]
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: ./.github/actions/build-push
        with:
          context_path: "post_service"
          docker-file-path: ${{vars.POST_SERVICE_DOCKERFILE}}
          dockerhub-usernane: ${{vars.DOCKER_USERNAME}}
          dockerhub-access-token: ${{secrets.DOCKERHUB_ACCESS_TOKEN}}
          dockerhub-repository: ${{vars.POST_SERVICE_DOCKERHUB_REPOSITORY}}

  build-push-rest-service-stg:
    runs-on: ubuntu-latest
    needs: [ test-services-stg, trivy-scan-services-stg ]
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Login to Docker Hub
        uses: ./.github/actions/build-push
        with:
          context_path: "rest_service"
          docker-file-path: ${{vars.REST_SERVICE_DOCKERFILE}}
          dockerhub-usernane: ${{vars.DOCKER_USERNAME}}
          dockerhub-access-token: ${{secrets.DOCKERHUB_ACCESS_TOKEN}}
          dockerhub-repository: ${{vars.REST_SERVICE_DOCKERHUB_REPOSITORY}}