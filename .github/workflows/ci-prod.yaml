name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
    tags:
      - '**'

jobs:
  test-auth-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: test auth service
        uses:  ./.github/actions/test_service
        with:
          jwt_secret: ${{secrets.JWT_KEY}}
          service_path: "auth_service"

  test-post-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: test post service
        uses:  ./.github/actions/test_service
        with:
          service_path: "post_service"

  test-rest-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: test rest service
        uses:  ./.github/actions/test_service
        with:
          service_path: "rest_service"

  trivy-scan-auth-service-prd:
     runs-on: ubuntu-latest
     environment: production
     steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trivi Scan
        uses: ./.github/actions/trivy_scan
        with:
          requirements: ${{ vars.REQUIREMENTS_FILE }}
          service_path: "auth_service"

  trivy-scan-post-service-prd:
     runs-on: ubuntu-latest
     environment: production
     steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trivi Scan
        uses: ./.github/actions/trivy_scan
        with:
          requirements: ${{ vars.REQUIREMENTS_FILE }}
          service_path: "post_service"
  
  trivy-scan-rest-service-prd:
     runs-on: ubuntu-latest
     environment: production
     steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trivi Scan
        uses: ./.github/actions/trivy_scan
        with:
          requirements: ${{ vars.REQUIREMENTS_FILE }}
          service_path: "rest_service"

  build-push-auth-service-prd:
    runs-on: ubuntu-latest
    needs: [ test-auth-service, test-post-service, test-rest-service, trivy-scan-auth-service-prd, trivy-scan-post-service-prd, trivy-scan-rest-service-prd ]
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build push dev
        uses: ./.github/actions/build-push
        with:
          context_path: "auth_service"
          docker-file-path: ${{vars.AUTH_SERVICE_DOCKERFILE}}
          dockerhub-usernane: ${{vars.DOCKER_USERNAME}}
          dockerhub-access-token: ${{secrets.DOCKERHUB_ACCESS_TOKEN}}
          dockerhub-repository: ${{vars.AUTH_SERVICE_DOCKERHUB_REPOSITORY}}

  build-push-post-service-prd:
    runs-on: ubuntu-latest
    needs: [ test-auth-service, test-post-service, test-rest-service, trivy-scan-auth-service-prd, trivy-scan-post-service-prd, trivy-scan-rest-service-prd ]
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: ./.github/actions/build-push
        with:
          context_path: "post_service"
          docker-file-path: ${{vars.POST_SERVICE_DOCKERFILE}}
          dockerhub-usernane: ${{vars.DOCKER_USERNAME}}
          dockerhub-access-token: ${{secrets.DOCKERHUB_ACCESS_TOKEN}}
          dockerhub-repository: ${{vars.POST_SERVICE_DOCKERHUB_REPOSITORY}}

  build-push-rest-service-prd:
    runs-on: ubuntu-latest
    needs: [ test-auth-service, test-post-service, test-rest-service, trivy-scan-auth-service-prd, trivy-scan-post-service-prd, trivy-scan-rest-service-prd ]
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Login to Docker Hub
        uses: ./.github/actions/build-push
        with:
          context_path: "rest_service"
          docker-file-path: ${{vars.REST_SERVICE_DOCKERFILE}}
          dockerhub-usernane: ${{vars.DOCKER_USERNAME}}
          dockerhub-access-token: ${{secrets.DOCKERHUB_ACCESS_TOKEN}}
          dockerhub-repository: ${{vars.REST_SERVICE_DOCKERHUB_REPOSITORY}}