apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-posts-ingress
  namespace: staging
  annotations:
    # 1. Tells NGINX to talk to the backend pods over HTTPS instead of HTTP
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"

    # 2. Replaces Traefik's 'serverName' to handle the SNI / Pod IP mismatch
    nginx.ingress.kubernetes.io/proxy-ssl-name: "staging.backend.blog-posts.com"

    # 3. Forces NGINX to verify the backend certificate against a CA
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"

    # 4. Replaces Traefik's 'rootCAsSecrets' (Format: "namespace/secret-name")
    nginx.ingress.kubernetes.io/proxy-ssl-secret: "staging/stg-backend-ca"
spec:
  tls:
    - secretName: backend-staging-tls-secret
      hosts:
        - staging.backend.blog-posts.com
  rules:
  - host: staging.backend.blog-posts.com
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: rest-internal-service
            port: 
              number: 80
  ingressClassName: nginx 