apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ingress/jaeger-ingress.yaml

patches:
  - target:
      kind: Ingress
      name: jaeger-ingress # Ensure this matches your actual Ingress metadata.name
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: observability.jaeger.blog-posts.com.127.0.0.1.nip.io
      - op: replace
        path: /spec/rules/0/host
        value: observability.jaeger.blog-posts.com.127.0.0.1.nip.io