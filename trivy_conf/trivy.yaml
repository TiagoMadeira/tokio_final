scan:
  scanners:
    - vuln
    - secret

  # trivy.yaml
  file-patterns:
    - "pip:requirements-prd.txt"
    - "pip:requirements-stg.txt"

  skip-files:
    - "state.json"

severity:
  - LOW
  - MEDIUM
  - HIGH
  - CRITICAL

vulnerability:
  ignore-unfixed: false

misconfiguration:
  namespaces:
    - tiagomadeiradock

data:
  kubernetes:
    all_trusted_repositories:
      - "docker.io"
      - "registry.k8s.io"
      
db:
  repository: public.ecr.aws/aquasecurity/trivy-db:2
