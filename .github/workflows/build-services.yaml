name: build services

on:
  workflow_call:
    secrets:
      dockerhub-access-token:
        required: true
        description: dockerhub access token
    
jobs:
  build-push-auth-service:
    runs-on: [ubuntu-24.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build push 
        uses: ./.github/actions/build-push
        with:
          context_path: "blog_posts_app/auth_service"
          docker-file-path: "blog_posts_app/auth_service/Dockerfile"
          dockerhub-usernane: ${{vars.DOCKER_USERNAME}}
          dockerhub-access-token: ${{secrets.dockerhub-access-token}}
          dockerhub-repository: ${{vars.AUTH_SERVICE_DOCKERHUB_REPOSITORY}}

  build-push-post-service:
    runs-on: [ubuntu-24.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build push 
        uses: ./.github/actions/build-push
        with:
          context_path: "blog_posts_app/post_service"
          docker-file-path: "blog_posts_app/post_service/Dockerfile"
          dockerhub-usernane: ${{vars.DOCKER_USERNAME}}
          dockerhub-access-token: ${{secrets.dockerhub-access-token}}
          dockerhub-repository: ${{vars.POST_SERVICE_DOCKERHUB_REPOSITORY}}

  build-push-rest-service:
    runs-on: [ubuntu-24.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Build push 
        uses: ./.github/actions/build-push
        with:
          context_path: "blog_posts_app/rest_service"
          docker-file-path: "blog_posts_app/rest_service/Dockerfile"
          dockerhub-usernane: ${{vars.DOCKER_USERNAME}}
          dockerhub-access-token: ${{secrets.dockerhub-access-token}}
          dockerhub-repository: ${{vars.REST_SERVICE_DOCKERHUB_REPOSITORY}}
  
  build-push-frontend:
    runs-on: [ubuntu-24.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Build push 
        uses: ./.github/actions/build-push
        with:
          context_path: "blog_posts_app/frontend"
          docker-file-path: "blog_posts_app/frontend/Dockerfile"
          dockerhub-usernane: ${{vars.DOCKER_USERNAME}}
          dockerhub-access-token: ${{secrets.dockerhub-access-token}}
          dockerhub-repository: ${{vars.FRONTEND_DOCKERHUB_REPOSITORY}}