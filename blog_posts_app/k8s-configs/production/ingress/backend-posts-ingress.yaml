apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-posts-ingress
  namespace: production
  annotations:
    # 1. Tells NGINX to talk to the backend pods over HTTPS instead of HTTP
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"

    # 2. Replaces Traefik's 'serverName' to handle the SNI / Pod IP mismatch
    nginx.ingress.kubernetes.io/proxy-ssl-name: "backend.blog-posts.com"

    # 3. Forces NGINX to verify the backend certificate against a CA
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"

    # 4. Replaces Traefik's 'rootCAsSecrets' (Format: "namespace/secret-name")
    nginx.ingress.kubernetes.io/proxy-ssl-secret: "production/prd-backend-ca"
spec:
  tls:
    - secretName: backend-production-posts-com-tls
      hosts:
        - backend.blog-posts.com
  rules:
  - host: backend.blog-posts.com
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: rest-internal-service
            port: 
              number: 80
  ingressClassName: nginx 