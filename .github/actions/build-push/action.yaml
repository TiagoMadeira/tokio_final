name: build-push
description: build and push docker image

inputs:
  docker-file-path:
    required: true
    description: dockerfile to be built

  dockerhub-usernane:
    required: true
    description: dockerhub username

  dockerhub-access-token:
    required: true
    description: dockerhub access token

  dockerhub-repository:
    required: true
    description: dockerhub repo name

  context_path:
    required: true
    description: path to app we want to build

runs:
  using: "composite"
  steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.dockerhub-usernane }}
          password: ${{ inputs.dockerhub-access-token }}

      - name: Extract metadata
        shell: bash
        run: |
          echo "ref=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT
        id: extract_metadata
      
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.dockerhub-usernane }}/${{ inputs.dockerhub-repository}}
          tags: |
            ${{steps.extract_metadata.outputs.ref}}
            ${{steps.extract_metadata.outputs.short_sha}}
            latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context_path }}
          push: ${{ github.event_name != 'pull_request' }}
          tags:  ${{ steps.meta.outputs.tags }}
          file: ${{ inputs.docker-file-path }}
          build-args: |
            APP_ENV=prd